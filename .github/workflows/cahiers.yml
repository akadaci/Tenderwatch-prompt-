name: Cahiers des charges
on:
  schedule:
    - cron: "47 */2 * * *"     # 30 min après la collecte, toutes les 2 h
  workflow_dispatch:
    inputs:
      limite: {description: "Nombre de marchés à lire (par type)", default: "5"}
  push:
    branches: [main]
    paths: ["radar/csc.py", "radar/bda_detail.py", "radar/geo.py", ".github/workflows/cahiers.yml"]
permissions:
  contents: write
concurrency: {group: collecte, cancel-in-progress: false}
jobs:
  cahiers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Installer Python et le navigateur (résiste aux pannes des serveurs Ubuntu)
        run: |
          pip install --retries 10 -r requirements.txt
          for i in 1 2 3; do python -m playwright install chromium && break; echo "téléchargement du navigateur raté ($i/3)"; sleep 30; done
          timeout 420 python -m playwright install-deps chromium || echo "::warning::Serveurs Ubuntu injoignables : on continue avec les bibliothèques déjà présentes sur la machine GitHub"
      - name: Tests
        run: python -m pytest -q tests
      - name: Fiches détaillées (adresse, date limite)
        continue-on-error: true
        run: python -c "from radar import bda_detail; bda_detail.run()"
      - name: Lecture des cahiers des charges
        continue-on-error: true
        timeout-minutes: 30
        run: python -m radar.csc "${{ github.event.inputs.limite || '5' }}"
      - name: Export pour la page
        run: python -m radar.export
      - name: Enregistrer
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Cahiers des charges $(date -u +%F' '%H:%M) UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
