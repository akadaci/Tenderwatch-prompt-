name: Collecte
on:
  schedule:
    - cron: "17 4,10,16,22 * * *"     # toutes les 6 h (heure UTC)
  workflow_dispatch:
    inputs:
      days_back: {description: "Jours à remonter", default: "7"}
  push:
    branches: [main]
    paths: ["radar/**", ".github/workflows/collecte.yml"]
permissions:
  contents: write
concurrency: {group: collecte, cancel-in-progress: false}
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Collecte
        id: run
        continue-on-error: true
        run: python -m radar.main "${{ github.event.inputs.days_back || '14' }}"
      - name: Enregistrer les données
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Données $(date -u +%F' '%H:%M) UTC" && git pull --rebase && git push)
      - name: Signaler une source en panne
        if: steps.run.outcome == 'failure'
        run: exit 1
