name: Collecte
on:
  schedule:
    - cron: "43 * * * *"     # chaque heure : GitHub saute beaucoup de créneaux planifiés, plus de créneaux = données fraîches
  workflow_dispatch:
    inputs:
      days_back: {description: "Jours à remonter", default: "3"}
  push:
    branches: [main]
    paths: ["radar/ted.py", "radar/bda.py", "radar/nova.py", "radar/main.py", ".github/workflows/collecte.yml"]
permissions:
  contents: write
  actions: write
concurrency: {group: collecte, cancel-in-progress: false}
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}            # dernière version, pas celle du déclenchement
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Tests
        run: python -m pytest -q tests
      - name: Collecte
        id: run
        continue-on-error: true
        run: python -m radar.main "${{ github.event.inputs.days_back || '3' }}"
      - name: Enregistrer les données
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Données $(date -u +%F' '%H:%M) UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Lancer la lecture des cahiers des charges (ne dépend plus du seul planning GitHub)
        if: always() && github.event_name != 'push'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run cahiers.yml --ref main -R "${{ github.repository }}" || true
      - name: Signaler une source en panne
        if: steps.run.outcome == 'failure'
        run: exit 1
